agent_name: "StyleImp"

model:
  # experiment 2: stock deepmimic actor with the style appended to the observation.
  # one trunk, one head over the full action, nothing routed. the style reaches the pd targets
  # directly, so pose_style_reg_weight below is the ONLY thing enforcing the factorization.
  # pose_net / imp_net are unused in this mode.
  pose_input: "obs_style"
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

actor_optimizer:
    type: "Adam"
    learning_rate: 1e-4

critic_optimizer:
    type: "Adam"
    learning_rate: 1e-4

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000
use_mixed_precision: false

actor_epochs: 5
actor_batch_size: 4
critic_epochs: 2
critic_batch_size: 2

td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0

# THE constraint in this experiment: penalizes how much the pd targets of different styles
# disagree at the same phase. sweep the weight, 0.0 is the no-constraint baseline.
pose_style_reg_weight: 1.0
pose_style_reg_bins: 20
pose_style_reg_min_count: 2
# divide by the spread of the targets over the whole motion: keeps wide-range joints from
# dominating and puts the loss on the same scale as the reported pose_style_ratio, so the weight
# carries over between motions. it does NOT block the degenerate minimum where q* collapses to a
# constant -- only the tracking reward does. watch pose_var.
pose_style_reg_normalize: True
